<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi bạn Trương Thị Minh Thư</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a5c;--sky:#bcd3f5;--blush:#f7d6df;--gold:#d9b25f;--paper:#fffaf3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--navy);background:linear-gradient(180deg,#8fb4ee,#cfe0fa 55%,#f9dfe6);background-attachment:fixed}
canvas#p{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.script{font-family:'Dancing Script','Brush Script MT',cursive}
#s1{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .9s,transform .9s;z-index:10}
#s1.gone{opacity:0;transform:scale(1.15);pointer-events:none}
.env{position:relative;width:min(84vw,360px);aspect-ratio:3/2;cursor:pointer;perspective:900px;animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.env .back{position:absolute;inset:0;background:#e9d7c4;border-radius:8px;box-shadow:0 20px 40px rgba(27,42,92,.3)}
.env .note{position:absolute;left:8%;right:8%;top:8%;height:80%;background:var(--paper);border-radius:4px;transition:transform .9s .5s ease}
.env .front{position:absolute;inset:0;border-radius:8px;background:linear-gradient(135deg,transparent 49.5%,#f1e2d1 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49.5%,#f1e2d1 50%) right/50% 100% no-repeat,linear-gradient(0deg,#f4e7d8 55%,transparent 55%);z-index:3}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:#ecd9c5;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease,z-index 0s .4s;z-index:4}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .note{transform:translateY(-55%)}
.seal{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9db3,#d6436b);color:#fff;display:grid;place-items:center;font-size:22px;z-index:5;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:opacity .3s}
.env.open .seal{opacity:0}
.to{position:absolute;left:0;right:0;bottom:12%;text-align:center;z-index:4;font-size:clamp(20px,6vw,28px);line-height:1.2;padding:0 8%}
.hint{font-size:14px;opacity:.75;animation:blink 1.8s infinite}
@keyframes blink{50%{opacity:.25}}
#s2{display:none;max-width:560px;margin:0 auto;padding:36px 16px 80px}
#s2.show{display:block}
.rise{opacity:0;transform:translateY(40px);animation:rise 1s .2s forwards}
@keyframes rise{to{opacity:1;transform:none}}
h2{text-align:center;font-size:30px;margin:0 0 18px;font-weight:600}
.card1{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(27,42,92,.35);transform-style:preserve-3d;transition:transform .15s;border:3px solid var(--gold)}
.card1 img{display:block;width:100%}
.card1::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.6s 1.4s infinite}
@keyframes shine{to{transform:translateX(120%)}}
.sp{position:absolute;width:12px;height:12px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 1.8s infinite;filter:drop-shadow(0 0 4px gold)}
@keyframes tw{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1.4);opacity:1}}
.cap{text-align:center;margin:22px 0 14px;font-size:15px}
.letter{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(27,42,92,.3);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.letter img{display:block;width:100%;pointer-events:none}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;cursor:grab;background:linear-gradient(135deg,rgba(255,250,243,.55),rgba(247,214,223,.8));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);will-change:transform}
.cover.back{transition:transform .5s ease}
.cover.fly{transition:transform .7s ease,opacity .7s;opacity:0}
.cover .ic{font-size:44px}
.cover .t{font-size:28px}
.arrow{font-size:26px;animation:nudge 1.2s infinite}
@keyframes nudge{50%{transform:translateX(14px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style></head><body>
<canvas id="p"></canvas>
<section id="s1">
  <div class="env" id="env" role="button" tabindex="0" aria-label="Mở thư">
    <div class="back"></div><div class="note"></div><div class="front"></div><div class="flap"></div><div class="seal">♥</div>
    <div class="to script">Gửi bạn<br>Trương Thị Minh Thư</div>
  </div>
  <div class="hint">Chạm vào lá thư để mở</div>
</section>
<main id="s2">

    <div class="cover" id="cover"><div class="ic">💌</div><div class="t script">Vuốt để mở thư</div><div class="arrow">➜</div></div>
  </div>
</main>
<script>
const cv=document.getElementById('p'),cx=cv.getContext('2d');let W,H,petals=[],conf=[],on=false;
function rs(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}rs();addEventListener('resize',rs);
const D=devicePixelRatio,cols=['#f9b8cb','#fbd0dc','#f59ab5','#fff'];
function mk(top){return{x:Math.random()*W,y:top?-20*D:Math.random()*H,s:(5+Math.random()*7)*D,v:(.6+Math.random()*1.2)*D,w:Math.random()*6,a:Math.random()*6,c:cols[Math.random()*4|0]}}
for(let i=0;i<38;i++)petals.push(mk(false));
function burst(){const g=['#f9b8cb','#d9b25f','#fff','#8fb4ee','#ff7aa2'];for(let i=0;i<90;i++){const a=Math.random()*Math.PI*2,v=(4+Math.random()*9)*D;conf.push({x:W/2,y:H*.35,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6*D,s:(4+Math.random()*5)*D,r:Math.random()*6,c:g[i%5],l:1})}}
function draw(){cx.clearRect(0,0,W,H);
for(const p of petals){p.y+=p.v;p.w+=.02;p.a+=.04;p.x+=Math.sin(p.w)*1.2*D;if(p.y>H+20*D)Object.assign(p,mk(true));
cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.scale(1,.55+.45*Math.sin(p.a*1.5));cx.fillStyle=p.c;cx.globalAlpha=.85;cx.beginPath();cx.ellipse(0,0,p.s,p.s*.6,0,0,7);cx.fill();cx.restore()}
conf=conf.filter(c=>c.l>0);for(const c of conf){c.x+=c.vx;c.y+=c.vy;c.vy+=.3*D;c.vx*=.98;c.r+=.2;c.l-=.008;cx.save();cx.globalAlpha=Math.max(c.l,0);cx.translate(c.x,c.y);cx.rotate(c.r);cx.fillStyle=c.c;cx.fillRect(-c.s/2,-c.s/4,c.s,c.s/2);cx.restore()}
requestAnimationFrame(draw)}draw();

const env=document.getElementById('env'),s1=document.getElementById('s1'),s2=document.getElementById('s2');
function openEnv(){if(env.classList.contains('open'))return;env.classList.add('open');
 setTimeout(()=>s1.classList.add('gone'),1700);
 setTimeout(()=>{s2.classList.add('show');scrollTo(0,0);burst();setTimeout(burst,700)},2200)}
env.onclick=openEnv;env.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openEnv()};

const c1=document.getElementById('c1');
for(let i=0;i<8;i++){const s=document.createElement('i');s.className='sp';s.style.left=(5+Math.random()*88)+'%';s.style.top=(5+Math.random()*88)+'%';s.style.animationDelay=(Math.random()*2)+'s';c1.appendChild(s)}
function tilt(x,y){const r=c1.getBoundingClientRect();const dx=(x-r.left)/r.width-.5,dy=(y-r.top)/r.height-.5;c1.style.transform=`perspective(800px) rotateY(${dx*16}deg) rotateX(${-dy*16}deg)`}
c1.addEventListener('pointermove',e=>tilt(e.clientX,e.clientY));
c1.addEventListener('pointerleave',()=>c1.style.transform='');
c1.addEventListener('click',burst);
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;c1.style.transform=`perspective(800px) rotateY(${Math.max(-20,Math.min(20,e.gamma))*.6}deg) rotateX(${Math.max(-20,Math.min(20,(e.beta-45)))*-.5}deg)`});

const cover=document.getElementById('cover'),L=document.getElementById('letter');let sx=null,dx=0;
cover.addEventListener('pointerdown',e=>{sx=e.clientX;cover.classList.remove('back');cover.setPointerCapture(e.pointerId)});
cover.addEventListener('pointermove',e=>{if(sx===null)return;dx=Math.max(0,e.clientX-sx);cover.style.transform=`translateX(${dx}px)`});
function end(){if(sx===null)return;sx=null;if(dx>L.offsetWidth*.3){cover.classList.add('fly');cover.style.transform='translateX(110%)';burst();setTimeout(()=>cover.remove(),800)}else{cover.classList.add('back');cover.style.transform=''}dx=0}
cover.addEventListener('pointerup',end);cover.addEventListener('pointercancel',end);
</script></body></html>
